[package]
name = "rem100"
version = "0.1.0"
edition = "2024"
authors = ["Arthur Heymans"]
description = "Rust library and command-line utility for the Dediprog EM100Pro SPI flash emulator"
license = "GPL-2.0-only"
repository = "https://github.com/ArthurHeymans/rem100"
documentation = "https://docs.rs/rem100"
rust-version = "1.85"
keywords = ["em100", "spi", "flash", "emulator", "dediprog"]
categories = ["command-line-utilities", "hardware-support"]
exclude = [".github/", ".envrc", "dist/", "flake.lock", "flake.nix"]

[features]
default = ["cli"]
cli = ["clap", "ctrlc", "indicatif", "reqwest", "xz2", "tar", "dirs"]
web = ["eframe", "egui", "poll-promise", "env_logger"]
native-gui = ["web", "rfd/xdg-portal"]

[dependencies]
# USB communication (native USB and browser WebUSB)
nusb = "0.2.6"
futures-lite = "2"

# Error handling
thiserror = "1"
anyhow = "1"

# Byte order conversion
byteorder = "1"

# CLI-only dependencies
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }
xz2 = { version = "0.1", optional = true }
tar = { version = "0.4", optional = true }
dirs = { version = "5", optional = true }
ctrlc = { version = "3", optional = true }
indicatif = { version = "0.17", optional = true }

# Web/GUI dependencies
eframe = { version = "0.32", optional = true, default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = { version = "0.29", optional = true }
poll-promise = { version = "0.3", optional = true, features = ["web"] }
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
env_logger = { version = "0.11", optional = true }

# Web-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
# nusb 0.2.6 requires the typed WebUSB bindings from these releases.
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "console",
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "File",
    "FileList",
    "Navigator",
    "WorkerNavigator",
    "WorkerGlobalScope",
    # WebUSB API types (needed by nusb)
    "Usb",
    "UsbDevice",
    "UsbConfiguration",
    "UsbInterface",
    "UsbAlternateInterface",
    "UsbEndpoint",
    "UsbDirection",
    "UsbEndpointType",
    "UsbControlTransferParameters",
    "UsbDeviceFilter",
    "UsbDeviceRequestOptions",
    "UsbInTransferResult",
    "UsbOutTransferResult",
    "UsbIsochronousInTransferResult",
    "UsbIsochronousOutTransferResult",
    "UsbIsochronousInTransferPacket",
    "UsbIsochronousOutTransferPacket",
    "UsbTransferStatus",
    "UsbRecipient",
    "UsbRequestType",
    "UsbConnectionEvent",
    "UsbConnectionEventInit",
] }
js-sys = "0.3.103"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
getrandom = { version = "0.2", features = ["js"] }
atomic-waker = "1"

[[bin]]
name = "rem100"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "rem100-web"
path = "src/web_main.rs"
required-features = ["web"]

[lib]
name = "em100"
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
opt-level = 3
lto = true

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = true

[build-dependencies]
xz2 = "0.1"
tar = "0.4"
byteorder = "1"
